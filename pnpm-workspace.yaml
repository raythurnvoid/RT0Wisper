# electron-builder packages node_modules as a flat tree, like npm.
nodeLinker: hoisted
# Native modules are rebuilt for Electron after install. Copies (not hard links to the
# store) and no build cache keep a Node build from coming back on the next install.
packageImportMethod: copy
sideEffectsCache: false
allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  ffmpeg-static: true
  onnxruntime-node: true
# Same pins as the npm "overrides" in package.json (pnpm does not read that field).
overrides:
  "adm-zip": "^0.6.1"
  "@tiptap/extension-blockquote": "3.31.3"
  "@tiptap/extension-bold": "3.31.3"
  "@tiptap/extension-bubble-menu": "3.31.3"
